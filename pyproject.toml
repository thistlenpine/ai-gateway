[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-gateway"
version = "0.1.0"
description = "OAuth2/OIDC-secured gateway for internal APIs, MCP servers and LLM providers, with OTel-only observability"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "pyjwt[crypto]>=2.9",
  "opentelemetry-api>=1.27",
  "opentelemetry-sdk>=1.27",
  "opentelemetry-exporter-otlp>=1.27",
  "opentelemetry-instrumentation-fastapi>=0.48b0",
  "opentelemetry-instrumentation-httpx>=0.48b0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "respx>=0.21",
  "pytest-timeout>=2.3",
  "pytest-cov>=5",
  "pytest-randomly>=3.15",
  "hypothesis>=6.100",
  "cryptography>=43",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-PyYAML",
]

[project.scripts]
ai-gateway = "ai_gateway.main:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_gateway"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["tests"]
timeout = 30
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]
markers = [
  "integration: real uvicorn servers on ephemeral ports (tests/integration)",
  "load: concurrency / load tests (tests/load)",
  "slow: real-time tests that take more than ~2s",
]

[tool.coverage.run]
source = ["ai_gateway"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "\\.\\.\\.$",
  "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 110
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# helpers/fixtures that deliberately use wide literals, real sleeps and nested contexts
"tests/integration/**" = ["E501", "ASYNC109", "SIM117", "SIM105", "RUF007"]
"tests/load/**" = ["E501", "ASYNC110", "B007"]
"tests/property/**" = ["E501", "RUF001", "SIM105", "SIM102"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src:tests"
exclude = ["^tests/observability/conftest\\.py$"]  # duplicate module name `conftest`; helpers live in obs_rig
plugins = ["pydantic.mypy"]
